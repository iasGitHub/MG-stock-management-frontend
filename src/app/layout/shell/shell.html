<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-icon">MG</span>
      <div>
        <strong>Montage Gold</strong>
        <small>Gestion de stock</small>
      </div>
    </div>

    <nav>
      <a routerLink="/dashboard" routerLinkActive="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        Tableau de bord
      </a>
      <a routerLink="/produits" routerLinkActive="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M12 13L3 8m9 5l9-5m-9 5v8"/></svg>
        Produits
      </a>
      <a routerLink="/mouvements" routerLinkActive="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
        Mouvements
      </a>
      <a routerLink="/fournisseurs" routerLinkActive="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v11a1 1 0 001 1h14a1 1 0 001-1V9"/><path d="M9 21v-6h6v6"/></svg>
        Fournisseurs
      </a>
      @if (auth.isAdmin()) {
        <a routerLink="/utilisateurs" routerLinkActive="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
          Utilisateurs
        </a>
      }
    </nav>

    <button class="btn btn-secondary logout" (click)="auth.logout()">Déconnexion</button>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
