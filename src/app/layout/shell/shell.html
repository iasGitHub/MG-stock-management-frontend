<div class="layout">
  <div
    class="sidebar-overlay"
    [class.open]="menuOpen()"
    (click)="closeMenu()"
  ></div>

  <aside class="sidebar" [class.open]="menuOpen()">
    <div class="sidebar-head">
      <div class="brand">
        <img src="montage-gold-mauritanie.png" alt="Montage Gold" class="brand-icon" />
        <div>
          <strong>Montage Gold Mauritanie</strong>
        </div>
      </div>
      <button class="icon-btn close-btn" type="button" (click)="closeMenu()" aria-label="Fermer le menu">×</button>
    </div>

    <nav>
      <a routerLink="/dashboard" routerLinkActive="active" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        Tableau de bord
      </a>
      <a routerLink="/products" routerLinkActive="active" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M12 13L3 8m9 5l9-5m-9 5v8"/></svg>
        Produits
      </a>
      <a routerLink="/movements" routerLinkActive="active" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
        Mouvements
      </a>
      <a routerLink="/suppliers" routerLinkActive="active" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v11a1 1 0 001 1h14a1 1 0 001-1V9"/><path d="M9 21v-6h6v6"/></svg>
        Fournisseurs
      </a>
      <a routerLink="/categories" routerLinkActive="active" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
        Catégories
      </a>
      <a routerLink="/invoice-import" routerLinkActive="active" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8m8 4H8m-2-8h4"/></svg>
        Import Factures
      </a>
      @if (auth.isAdmin()) {
        <a routerLink="/users" routerLinkActive="active" (click)="closeMenu()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
          Utilisateurs
        </a>
      }
    </nav>

    <button class="btn btn-secondary logout" (click)="auth.logout()">Déconnexion</button>
  </aside>

  <main class="content">
    <div class="mobile-topbar">
      <button class="icon-btn" type="button" (click)="menuOpen.set(true)" aria-label="Ouvrir le menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <strong class="mobile-brand">Montage Gold Mauritanie</strong>
    </div>
    <router-outlet />
  </main>
</div>
